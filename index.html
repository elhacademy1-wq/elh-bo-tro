<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bài bổ trợ Từ vựng & Ngữ pháp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Bố cục: một trang, hai khu vực màu (THCS xanh dương, THPT xanh Vinamilk), thẻ tiêu đề bo góc như ảnh tham khảo */
:root{--font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
 --a:#334155;--a2:#64748b;--soft:#eef1f6;--bg:#f6f7fa;--ink:#1c2433;--mut:#5b6577;--line:#dfe3ec;--card:#fff;
 --ok:#15803d;--okbg:#e7f6ec;--bad:#b91c1c;--badbg:#fdecec;--warn:#92400e;--warnbg:#fff4de;--r:18px}
body[data-zone=THCS]{--a:#2563eb;--a2:#5eb0ff;--soft:#e6f0ff;--bg:#f3f8ff;--ink:#10264d;--mut:#51648a;--line:#cfdcf5}
/* THPT + Hồ sơ cá nhân: xanh Vinamilk, lấy từ bảng màu 4E53E3 · 4F6E9D · A4A2CA · ECEAFB */
body[data-zone=THPT],body[data-zone=me]{--a:#4E53E3;--a2:#4F6E9D;--soft:#ECEAFB;--bg:#F5F5FD;--ink:#1F2547;--mut:#4F6E9D;--line:#D8D4E3}
/* Bảng vinh danh: vàng chói lọi */
body[data-zone=hof]{--a:#B45309;--a2:#FBBF24;--soft:#FFF3C4;--bg:#FFFBEB;--ink:#3A2A05;--mut:#7A5B12;--line:#F3DFA2}
body[data-zone=hof] .hero{background:linear-gradient(135deg,#F59E0B 0%,#FCD34D 55%,#FEF08A 100%);color:#3A2A05;box-shadow:0 8px 28px rgba(245,158,11,.35)}
body[data-zone=hof] .hero:after{background:rgba(255,255,255,.4)}
body[data-zone=hof] .hero .eyebrow{color:#7A4A00}
body[data-zone=hof] .pod.r1{background:linear-gradient(#FFF7CC,#FFFFFF);border-color:#F5B301;box-shadow:0 0 0 3px rgba(251,191,36,.35),0 10px 26px rgba(245,158,11,.4)}
body[data-zone=hof] .pod.r1 .sc{color:#B45309}
body[data-zone=hof] .pod.r2{background:linear-gradient(#F3F4F6,#fff)}body[data-zone=hof] .pod.r3{background:linear-gradient(#FFF1E4,#fff)}
body[data-zone=hof] .fill.g{background:linear-gradient(90deg,#F59E0B,#FCD34D)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:920px;margin:0 auto}
a{color:var(--a)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{line-height:1.25;margin:0;text-wrap:balance}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}
.brand{font-weight:800;letter-spacing:-.01em;text-decoration:none;color:var(--ink)}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--mut)}
.crumbs a{text-decoration:none}
.hero{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;border-radius:22px;padding:24px 22px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-50px;top:-50px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.14)}
.hero .eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.hero h1{font-size:clamp(24px,5vw,34px);font-weight:800;margin:6px 0 8px;position:relative}
.hero p{margin:0;opacity:.95;max-width:60ch;position:relative}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;position:relative}
.chip{background:#fff;color:var(--a);border-radius:999px;padding:3px 12px;font-size:12px;font-weight:700}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:16px}
.panel.dash{border:1.5px dashed var(--a2)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.zone{display:block;text-decoration:none;color:#fff;border-radius:24px;padding:26px 24px;min-height:200px;position:relative;overflow:hidden;border:0;text-align:left;cursor:pointer;width:100%}
.zone.thcs{background:linear-gradient(135deg,#1d4ed8,#5eb0ff)}
.zone.thpt{background:linear-gradient(135deg,#4E53E3,#4F6E9D)}
.zone h2{font-size:28px;font-weight:800;margin:6px 0}
.zone .eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.zone p{margin:0 0 14px;opacity:.95}
.zone:after{content:"";position:absolute;right:-40px;bottom:-60px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.16)}
.zone:hover,.zone:focus-visible{filter:brightness(1.05)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--a);color:#fff;text-decoration:none;min-height:42px}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.ghost{background:var(--soft);color:var(--a)}
.btn.line{background:#fff;color:var(--a);border:1.5px solid var(--a)}
.btn.danger{background:var(--bad)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px;border-radius:10px}
:focus-visible{outline:3px solid var(--a2);outline-offset:2px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 16px;font-weight:600;cursor:pointer;color:var(--ink)}
.pill[aria-pressed=true]{background:var(--a);border-color:var(--a);color:#fff}
.tabs{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.tab{flex:1 1 160px;text-align:center;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px;font-weight:700;cursor:pointer}
.tab[aria-selected=true]{background:var(--a);color:#fff;border-color:var(--a)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:14px}
label.f{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:4px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=datetime-local],select,textarea{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;min-height:42px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 3px var(--soft)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{font-size:16px}
.card .meta{font-size:13px;color:var(--mut)}
.tag{display:inline-block;background:var(--soft);color:var(--a);border-radius:8px;padding:1px 9px;font-size:12px;font-weight:700;margin:0 6px 4px 0}
.tag.test{background:var(--warnbg);color:var(--warn)}
.card .btn{margin-top:auto;align-self:flex-start}
.notice{border-radius:12px;padding:10px 14px;font-size:14px;margin-top:12px}
.notice.warn{background:var(--warnbg);color:var(--warn)}
.notice.ok{background:var(--okbg);color:var(--ok)}
.notice.bad{background:var(--badbg);color:var(--bad)}
.notice.info{background:var(--soft);color:var(--a)}
.rules{margin:8px 0 0;padding-left:18px;font-size:14px;color:var(--mut)}
.oexp{margin:4px 0 0 8px;padding:8px 12px;border-left:3px solid var(--line);font-size:13.5px;color:var(--mut);border-radius:0 8px 8px 0;background:#fafafa}.oexp.ok{border-color:#4caf7a;background:var(--okbg);color:#14532d}.oexp.no{border-color:#e07070;background:#fff7f7}
.q .prompt u,.q .ctx u{text-decoration-thickness:2px;text-underline-offset:3px}
.bars{margin-top:6px}.brow{display:grid;grid-template-columns:minmax(90px,34%) 1fr 46px;gap:8px;align-items:center;margin:7px 0;font-size:14px}
.track{background:var(--soft);border-radius:8px;height:12px;overflow:hidden}.fill{height:100%;border-radius:8px;min-width:3px}.fill.g{background:#16a34a}.fill.r{background:#dc2626}.fill.a{background:#d97706}
.brow b.g{color:#15803d}.brow b.r{color:#b91c1c}.brow b.a{color:#b45309}.lvtag{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:10px;color:#fff;margin-left:6px}.lvtag.g{background:#16a34a}.lvtag.a{background:#d97706}.lvtag.r{background:#dc2626}.lvtag.n{background:#9ca3af}.focusbox{background:var(--soft);border-radius:14px;padding:12px 14px}.focusbox .row2{display:flex;justify-content:space-between;gap:10px;padding:3px 0}.gp{margin:6px 0 0;padding-left:18px}.hd{font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin:14px 0 2px}
.remcard{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px;background:#fff}
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-top:12px}
details.q>summary{list-style:none}details.q>summary::-webkit-details-marker{display:none}details.q[open]>summary{margin-bottom:8px}
.kpibtn{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line)}.kpibtn:hover,.kpibtn:focus-visible{border-color:var(--th,#5b3fa8)}
.histlink{color:inherit;text-decoration:none;cursor:pointer}.histlink:hover,.histlink:focus-visible{background:var(--soft,rgba(91,63,168,.08));outline:none}
.q.res-correct{border-color:#7bc99a;background:#fbfffc}
.q.res-wrong{border-color:#eba0a0;background:#fffafa}
.q.res-review{border-color:#e8c27a;background:#fffdf7}
.q .num{font-size:12px;font-weight:800;color:var(--a);letter-spacing:.06em;text-transform:uppercase}
.q .prompt{font-weight:600;margin:4px 0 10px;white-space:pre-line}
.q .ctx{background:var(--soft);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px;white-space:pre-line}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;margin-top:8px;cursor:pointer;background:#fff}
.opt:has(input:checked){border-color:var(--a);background:var(--soft)}
.opt input{margin-top:5px;accent-color:var(--a)}
.opt b{color:var(--a)}
.opt.is-right{border-color:#4caf7a;background:var(--okbg)}
.opt.is-mine-wrong{border-color:#e07070;background:var(--badbg)}
.fb{margin-top:10px;font-size:14px;border-radius:12px;padding:10px 12px}
.fb.right{background:var(--okbg);color:var(--ok)}
.fb.wrong{background:var(--badbg);color:var(--bad)}
.fb.review{background:var(--warnbg);color:var(--warn)}
.fb small{display:block;color:var(--ink);opacity:.85;margin-top:4px;font-size:13.5px}
.matchrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;margin-top:8px}
@media(max-width:520px){.matchrow{grid-template-columns:1fr}}
.q .who{font-size:12px;font-weight:700;color:var(--muted,#6b7280);margin:-2px 0 6px}
.stickybar{position:sticky;bottom:0;margin-top:16px;padding:12px 0 max(12px,env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.exam{display:grid;grid-template-columns:minmax(0,1fr) 250px;grid-template-areas:"main nav";gap:16px;align-items:start}
.exam>.examMain{grid-area:main;min-width:0}.exam>.qnav{grid-area:nav}
.qnav{position:sticky;top:12px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px;box-shadow:0 4px 18px rgba(0,0,0,.05)}
.qnav .trow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.qnav .tlabel{font-size:12px;color:var(--mut);font-weight:700}
.qnav .timer{font-size:24px;padding:4px 12px}
.qstat{font-size:13px;color:var(--mut);margin-top:8px;line-height:1.7}.qstat b{color:var(--ink)}
.qgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px;max-height:46vh;overflow:auto;padding:5px 3px}
.qb{position:relative;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 0;font-weight:800;cursor:pointer;color:var(--mut);font-size:14px;font-family:inherit}
.qb.done{background:var(--a);border-color:var(--a);color:#fff}
.qb.flag{box-shadow:0 0 0 2px #fbbf24}
.qb.flag::after{content:'⚑';position:absolute;top:-7px;right:-5px;font-size:12px;color:#d97706;background:#fff;border-radius:50%;line-height:1;padding:1px 2px}
.qleg{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:12px;color:var(--mut);margin-top:10px}
.qleg i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:4px;border:1.5px solid var(--line)}
.qleg i.d{background:var(--a);border-color:var(--a)}.qleg i.f{box-shadow:0 0 0 2px #fbbf24;border-color:#fff}
.navtoggle{display:none}
.q{scroll-margin-top:84px}
.q.flagged{border-left:5px solid #f59e0b}
.flagbtn{float:right;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:700;color:var(--mut);cursor:pointer;font-family:inherit}
.flagbtn[aria-pressed=true]{background:#fef3c7;border-color:#f59e0b;color:#92400e}
@media(max-width:860px){
 .exam{grid-template-columns:1fr;grid-template-areas:"nav" "main"}
 .qnav{position:sticky;top:0;z-index:20;margin-top:6px;padding:10px 12px;border-radius:0 0 16px 16px}
 .qnav .gridbox{display:none}.qnav.open .gridbox{display:block}
 .navtoggle{display:inline-flex;align-items:center;gap:6px}.qgrid{grid-template-columns:repeat(6,1fr);max-height:36vh}
 .qnav .timer{font-size:20px}
}
.timer{font-weight:800;font-variant-numeric:tabular-nums;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:6px 12px}
.timer.low{color:var(--bad);border-color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mut)}
.scoreboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.scoreboard div{border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;background:#fff;font-size:13px;color:var(--mut)}
.scoreboard b{display:block;font-size:15px;color:var(--ink)}
.overlay{position:fixed;inset:0;background:rgba(15,20,35,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dialog{background:#fff;border-radius:20px;padding:22px;max-width:460px;width:100%;max-height:90vh;overflow:auto}
.dialog.wide{max-width:760px}
.dialog h3{margin-bottom:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end;margin-top:16px}
.tablewrap{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:14px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--soft);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);white-space:nowrap}
.badge{display:inline-block;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:700}
.badge.sent{background:var(--okbg);color:var(--ok)}
.badge.failed,.badge.no_recipient{background:var(--badbg);color:var(--bad)}
.badge.pending,.badge.queued{background:var(--warnbg);color:var(--warn)}
.topnav{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;align-items:end}.podium .pod.r1{padding-top:26px;padding-bottom:26px;transform:translateY(-6px)}.podium .pod.r1 .medal{font-size:40px}.podium .pod.r1 .sc{font-size:32px}.podium.p1{grid-template-columns:minmax(0,260px);justify-content:center}.podium.p2{grid-template-columns:repeat(2,1fr)}@media(max-width:520px){.pod{padding:10px 6px}.pod b{font-size:14px;word-break:break-word}.pod .sc{font-size:20px}.podium .pod.r1 .sc{font-size:24px}}
.pod{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.pod .medal{font-size:30px;line-height:1}.pod b{display:block;font-size:17px;margin-top:4px}.pod .sc{font-size:26px;font-weight:800;color:var(--a);font-variant-numeric:tabular-nums}
.pod.r1{border-color:#f5b301;background:linear-gradient(#fffaf0,#fff)}.pod.r2{border-color:#9ca3af}.pod.r3{border-color:#c2824a}
.rank{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:8px 2px;border-top:1px solid var(--line);font-size:14px}
.rank.hist{grid-template-columns:118px 1fr auto}@media(max-width:480px){.rank.hist{grid-template-columns:1fr auto}.rank.hist>span.mut{grid-column:1/-1;font-size:12px}}.rank:first-of-type{border-top:0}.rank .n{font-weight:800;color:var(--mut)}
.lc{width:100%;height:auto;display:block}.lc text{fill:var(--mut);font-size:10px}

.hb{margin:7px 0;font-size:14px}.hb .top2{display:flex;justify-content:space-between;gap:8px}.hb .sub{font-size:12px;color:var(--mut)}

.filters2{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-top:14px}.filters2 label{font-size:12px;font-weight:700;color:var(--mut);display:block}.filters2 select,.filters2 input{min-width:130px}

<script>
/* ============ CẤU HÌNH ============

const $ = s => document.querySelector(s);

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = s => {
  const open = { b: 0, i: 0, u: 0 }, tag = { b: 'strong', i: 'em', u: 'u' };
  let t = esc(s).replace(/\*\*([^*]+)\*\*/g, '{b}$1{/b}').replace(/\{(\/?)(b|i|u)\}/g, (m, sl, k) => {
    if (sl) { if (!open[k]) return ''; open[k] = 0; return '</' + tag[k] + '>'; }
    if (open[k]) return ''; open[k] = 1; return '<' + tag[k] + '>';
  });
  for (const k of ['b', 'i', 'u']) if (open[k]) t += '</' + tag[k] + '>';
  return t;
};
const uid = p => (p || 'id') + '_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const norm = s => String(s == null ? '' : s).toLowerCase().replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/\s+/g, ' ').replace(/[.!?;,\s]+$/, '').trim();
function normSite(v) { v = String(v || '').trim().split('#')[0].replace(/index\.html?$/i, ''); if (v && !/\/$/.test(v)) v += '/'; return v; }
const store = { get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } } };
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; }

let DB = null;
async function loadContent() {
  if (DB) return DB;
  if (DEMO) { DB = JSON.parse(JSON.stringify(SAMPLE)); return DB; }
  const r = await fetch(API_URL + '?action=content');
  DB = await r.json();
  if (!DB || !Array.isArray(DB.exercises)) throw new Error('bad content');
  return DB;
}
async function api(body) {
  let r;
  try { r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow' }); }
  catch (e) { throw new Error('mạng hoặc trình duyệt chặn yêu cầu (' + (e && e.message) + ')'); }
  const t = await r.text();
  try { return JSON.parse(t); }
  catch (e) { throw new Error('máy chủ trả về HTTP ' + r.status + ', không phải dữ liệu hợp lệ: ' + t.replace(/\s+/g, ' ').slice(0, 140)); }
}

/* ============ CHẤM ĐIỂM TẠI TRÌNH DUYỆT (chỉ DEMO) ============ */
function gradeQ(q, v) {
  if (q.type === 'mcq' || q.type === 'error') return (v === undefined || v === '') ? 'blank' : (Number(v) === Number(q.answer) ? 'correct' : 'wrong');
  if (q.type === 'match') {
    if (!v || !Object.keys(v).length) return 'blank';
    return (q.pairs || []).every((p, i) => norm(v[i]) === norm(p.r)) ? 'correct' : 'wrong';
  }
  if (v === undefined || v === null || String(v).trim() === '') return 'blank';
  const acc = (q.accepted || []).slice(); if (typeof q.answer === 'string' && q.answer) acc.push(q.answer);
  if (acc.some(a => norm(a) === norm(v))) return 'correct';
  const manual = q.manual !== undefined ? q.manual : (q.type === 'transform' || q.type === 'short');
  return manual ? 'review' : 'wrong';
}
function correctText(q) {
  if (q.type === 'mcq' || q.type === 'error') return LET[q.answer] + '. ' + (q.options || [])[q.answer];
  if (q.type === 'match') return (q.pairs || []).map(p => p.l + ' → ' + p.r).join('; ');
  const a = (q.accepted || []).slice(); if (typeof q.answer === 'string' && q.answer) a.unshift(q.answer); return a.join(' / ');
}
function localResult(ex, answers) {
  const counts = { total: 0, correct: 0, wrong: 0, blank: 0, review: 0 }; let pts = 0, got = 0;
  const revealed = ex.mode !== 'test' || (ex.revealAt && new Date(ex.revealAt) <= new Date());
  const results = ex.questions.map(q => {
    const st = gradeQ(q, answers[q.id]), p = Number(q.points) || 1;
    counts.total++; counts[st]++; pts += p; if (st === 'correct') got += p;
    return revealed ? { id: q.id, status: st, correct: correctText(q), explanation: q.explanation || '' } : { id: q.id, status: st };
  });
  return { ok: true, counts, scorePct: pts ? Math.round(got / pts * 1000) / 10 : 0, revealed, results,
    email: { status: 'demo', message: 'Chế độ DEMO: bài chưa được lưu và chưa gửi email.' } };
}

/* ============ ĐỊNH TUYẾN ============ */
let S = null; // trạng thái làm bài
let F = { skill: 'vocabulary', book: '', unit: '', topic: '' };
window.addEventListener('hashchange', route);
async function route() {
  clearInterval(S && S.timer);
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  window.scrollTo(0, 0);
  try {
    if (parts[0] === 'admin') { document.body.dataset.zone = 'THPT'; return viewAdmin(); }
    if (parts[0] === 'r') { document.body.dataset.zone = 'THPT'; return viewReport(parts[1] || ''); }
    app.innerHTML = '<div class="empty">Đang tải…</div>';
    await loadContent();
    if (!parts.length) return viewHome();
    if (parts[0] === 'ex') return viewExercise(parts[1]);
    if (parts[0] === 'hof') return viewHof(parts[1] || '');
    if (parts[0] === 'me') return parts[1] ? viewMyResult(parts[1]) : viewMe();
    if (GRADES[parts[0]]) { if (parts[1]) return viewGrade(parts[0], Number(parts[1])); return viewLevel(parts[0]); }
    viewHome();
  } catch (e) {
    console.error(e);
    app.innerHTML = '<div class="notice bad">Không tải được danh sách bài tập. Kiểm tra kết nối mạng rồi tải lại trang.</div>';
  }
}

const WNS = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
function parseDocxXml(xml) {
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const q1 = /^\s*(?:(?:Câu|Question|Q)\s*)?(\d+)\s*[.):]\s*/i;
  const expL = /^\s*(?:Giải thích|Giai thich|Explanation|GT)\s+([A-F])\s*[:：.)\-–]\s*([\s\S]*)$/i;
  const expG = /^\s*(?:Giải thích chung|Giải thích|Lời giải|Explanation)\s*[:：]\s*([\s\S]*)$/i;
  const topicRe = /^(?:Chủ đề|Chu de|Topic|Điểm ngữ pháp)\s*[:：]\s*(.+)$/i;
  const partRe = /^(?:Phần|Part)\s*[:：]\s*([A-Za-z])\s*$/i;
  const partHdr = /^(?:PART|Phần|Section)\s+([A-Z])\b\s*[:.\-–—]?\s*(.*)$/i;
  const headRe = /^(?:[IVX]+\.\s|[A-C]\.\s+PHẦN\b|PHẦN\b|PART\b)/i;
  const endRe = /^(?:ĐÁP ÁN|ĐÁP SỐ|ANSWER KEY|ANSWERS?\b|KEY\b|THE END|HẾT\b)/i;
  const arrowRe = /^\s*(?:→|->|=>|⇒)\s*/;
  // seg: lấy ch[a..b) thành chuỗi có thẻ {b}{i}{u}; giữ xuống dòng
  const mkSeg = (ch, fm) => (a, b) => {
    let o = '', i = a;
    while (i < b) {
      let j = i; while (j < b && fm[j] === fm[i]) j++;
      const text = ch.slice(i, j).join(''), f = fm[i];
      if (f && text.trim()) {
        const m = text.match(/^(\s*)([\s\S]*?)(\s*)$/);
        o += m[1] + (f & 1 ? '{b}' : '') + (f & 2 ? '{i}' : '') + (f & 4 ? '{u}' : '') + m[2] + (f & 4 ? '{/u}' : '') + (f & 2 ? '{/i}' : '') + (f & 1 ? '{/b}' : '') + m[3];
      } else o += text;
      i = j;
    }
    return o.replace(/[^\S\n]+/g, ' ').replace(/ ?\n ?/g, '\n').replace(/\n{2,}/g, '\n').trim();
  };
  // ---- 1. đọc từng đoạn Word ----
  const raw = [];
  Array.from(doc.getElementsByTagNameNS(WNS, 'p')).forEach(p => {
    const ch = [], hl = [], fm = [];   // fm: 1 = đậm, 2 = nghiêng, 4 = gạch chân
    Array.from(p.getElementsByTagNameNS(WNS, 'r')).forEach(r => {
      const rPr = Array.from(r.children).find(n => n.localName === 'rPr');
      let H = false, F = 0;
      if (rPr) Array.from(rPr.children).forEach(n => {
        const v = n.getAttributeNS(WNS, 'val');
        if (n.localName === 'highlight' && v !== 'none') H = true;
        if (n.localName === 'shd') { const f = (n.getAttributeNS(WNS, 'fill') || '').toLowerCase(); if (f && f !== 'auto' && f !== 'ffffff') H = true; }
        if (n.localName === 'b' && v !== '0' && v !== 'false') F |= 1;
        if (n.localName === 'i' && v !== '0' && v !== 'false') F |= 2;
        if (n.localName === 'u' && v !== 'none' && v !== '0' && v !== 'false') F |= 4;
      });
      Array.from(r.children).forEach(n => {
        if (n.localName === 't') { for (const c of n.textContent) { ch.push(c); hl.push(H); fm.push(F); } }

function lineChart(pts, label) {
  if (!pts.length) return '<div class="empty">Chưa có dữ liệu.</div>';
  const W = 560, H = 190, L = 32, R = 12, T = 12, B = 26, n = pts.length;
  const X = i => n === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (n - 1), Y = v => T + (1 - Math.max(0, Math.min(100, v)) / 100) * (H - T - B);
  const grid = [0, 50, 100].map(v => `<line class="gridl" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 5}" y="${Y(v) + 3}" text-anchor="end">${v}</text>`).join('');
  const thr = `<line class="thr" x1="${L}" x2="${W - R}" y1="${Y(70)}" y2="${Y(70)}"/><text x="${W - R}" y="${Y(70) - 3}" text-anchor="end" style="fill:#dc2626">70%</text>`;
  const line = n > 1 ? `<polyline class="ln" points="${pts.map((p, i) => X(i) + ',' + Y(p.v)).join(' ')}"/>` : '';
  const dots = pts.map((p, i) => `<circle class="pt" cx="${X(i)}" cy="${Y(p.v)}" r="4"><title>${esc(p.l)}: ${p.v}%${p.t ? ' · ' + esc(p.t) : ''}</title></circle>`).join('');
  const step = Math.max(1, Math.ceil(n / 7));
  const xl = pts.map((p, i) => (i % step === 0 || i === n - 1) ? `<text x="${X(i)}" y="${H - 8}" text-anchor="middle">${esc(p.l)}</text>` : '').join('');
  return `<svg class="lc" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label || 'Biểu đồ')}">${grid}${thr}${line}${dots}${xl}</svg>`;
}

async function meLogin(create) {
  const email = ($('#meEmail').value || '').trim(), pin = ($('#mePin').value || '').trim();
  ME.email = email; ME.pin = pin;
  if (!email || !pin) return meForm('Em nhập đủ email và PIN nhé.');
  let r; try { r = await api({ action: 'profile', email, pin, create: !!create }); } catch (e) { return meForm('Không kết nối được máy chủ.'); }
  if (!r.ok) { return meForm(r.code === 'no_pin' ? 'Email này chưa có PIN. Bấm “Tạo PIN này” để dùng PIN em vừa nhập.' : r.error, r.code === 'no_pin'); }
  store.set('elh_email', email); const next = ME.next; ME = { email, pin, data: r }; if (next) { if (location.hash === '#/me/' + next) viewMyResult(next); else location.hash = '#/me/' + next; return; } meRender();
}
async function viewMyResult(sid) {
  document.body.dataset.zone = 'me';
  if (DEMO) { app.innerHTML = '<div class="notice warn">Hồ sơ cần kết nối máy chủ.</div>'; return; }
  if (!ME.email || !ME.pin) { ME.next = sid; return meForm('Em đăng nhập bằng email và PIN để xem lại bài này.'); }
  app.innerHTML = '<div class="empty">Đang tải bài làm…</div>';
  let r; try { r = await api({ action: 'myResult', email: ME.email, pin: ME.pin, id: sid }); } catch (e) { app.innerHTML = '<div class="notice bad">Không kết nối được máy chủ. Em thử tải lại trang.</div>'; return; }
  if (!r.ok) {
    if (r.code === 'auth') { ME.pin = ''; ME.data = null; ME.next = sid; return meForm(r.error); }
    app.innerHTML = crumbs({ t: 'Trang chủ', href: '#/' }, { t: 'Hồ sơ của em', href: '#/me' }) + `<div class="notice bad" style="margin-top:10px">${esc(r.error)}</div><div class="row"><a class="btn ghost" href="#/me">← Về hồ sơ của em</a></div>`; return;
  }
  const flags = {}; (r.flags || []).forEach(id => { flags[id] = true; });
  document.body.dataset.zone = r.ex.level || 'me';
  S = { ex: r.ex, answers: r.answers || {}, flags, info: { name: r.name, cls: r.cls }, done: true, rightsOrder: {}, timer: null };
  renderResult(Object.assign({}, r, { past: true }));
}

/* ============ BÁO CÁO CÁ NHÂN (mở từ email giáo viên) ============ */
function arcPath(cx, cy, r, a0, a1) {
  const p = a => [cx + r * Math.sin(a), cy - r * Math.cos(a)], [x0, y0] = p(a0), [x1, y1] = p(a1);
  return `M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z`;
}
const GREENS = ['#16a34a', '#22c55e', '#15803d', '#4ade80'], REDS = ['#dc2626', '#ef4444', '#b91c1c', '#f87171'], GREYS = ['#9ca3af'];
/** items: [{label, value, color, right}] → biểu đồ tròn (có lỗ giữa) + chú thích */
function pieChart(items, centerTop, centerSub) {
  const tot = items.reduce((a, x) => a + x.value, 0);
  if (!tot) return '<div class="empty">Chưa có dữ liệu.</div>';
  let a = 0, paths = '';
  items.filter(x => x.value > 0).forEach(x => {
    const da = x.value / tot * Math.PI * 2;
    paths += da >= Math.PI * 2 - 1e-6 ? `<circle cx="95" cy="95" r="90" fill="${x.color}"/>` : `<path d="${arcPath(95, 95, 90, a, a + da)}" fill="${x.color}" stroke="#fff" stroke-width="2"/>`;
    a += da;
  });
  const svg = `<svg viewBox="0 0 190 190" role="img" aria-label="Biểu đồ tròn">${paths}<circle cx="95" cy="95" r="50" fill="#fff"/><text x="95" y="96" text-anchor="middle" font-size="24" font-weight="800" fill="#1F2547">${esc(centerTop || '')}</text><text x="95" y="114" text-anchor="middle" font-size="10" fill="#4F6E9D">${esc(centerSub || '')}</text></svg>`;
  return `<div class="pie">${svg}<div class="leg">${items.map(x => `<div><i style="background:${x.color}"></i><span>${esc(x.label)}</span><b>${esc(x.right != null ? x.right : x.value)}</b></div>`).join('')}</div></div>`;
}
const AMBERS = ['#d97706', '#f59e0b', '#b45309', '#fbbf24'];
const lvColor = (x, k) => (lvCls(x) === 'r' ? REDS : lvCls(x) === 'a' ? AMBERS : lvCls(x) === 'g' ? GREENS : GREYS)[k % 4];
function reportSummary(d) {
  const lv = d.score >= 85 ? 'rất tốt' : d.score >= 70 ? 'khá' : d.score >= 50 ? 'ở mức trung bình' : 'còn yếu';
  const weak = d.topics.filter(x => x.level === 'weak'), strong = d.topics.filter(x => x.level === 'strong'), watch = d.topics.filter(x => x.level === 'watch');
  const diff = Math.round((d.score - d.classAvg) * 10) / 10;
  let t = `<b>${esc(d.name)}</b> đạt <b>${d.score}%</b> (${d.correct}/${d.total} câu), mức <b>${lv}</b>`;
  if (d.classN > 1) t += `, ${diff >= 0 ? 'cao hơn' : 'thấp hơn'} điểm trung bình lớp (${d.classAvg}%) ${Math.abs(diff)} điểm, xếp <b>${d.rank}/${d.classN}</b> trong những bạn đã làm`;
  t += '.<br>';
  const fc = d.focus || [];
  if (fc.length) {
    const have = fc.filter(f => f.n > 0), fw = have.filter(f => f.level === 'weak'), fg = have.filter(f => f.level === 'strong'), fa = have.filter(f => f.level === 'watch');
    t += `<b>Chủ điểm đề dò:</b> ${fc.map(f => esc(f.name)).join(', ')}. `;
    if (have.length) t += 'Kết quả: ' + [fg.length ? `Vững: ${fg.map(f => esc(f.name)).join(', ')}` : '', fa.length ? `chưa chắc tay: ${fa.map(f => esc(f.name)).join(', ')}` : '', fw.length ? `<b style="color:var(--bad)">cần bổ trợ: ${fw.map(f => esc(f.name)).join(', ')}</b>` : ''].filter(Boolean).join('; ') + '.';
    t += '<br>';
  }
  t += strong.length ? `<b style="color:var(--ok)">Vững:</b> ${strong.map(x => esc(x.name) + ' (' + x.ok + '/' + x.n + ')').join(', ')}.<br>` : '';
  t += watch.length ? `<b style="color:#b45309">Cần củng cố nhẹ:</b> ${watch.map(x => esc(x.name) + ' (' + x.ok + '/' + x.n + ')').join(', ')}. Mới sai ${watch.every(x => x.n - x.ok === 1) ? '1 câu ở mỗi chủ đề này' : 'một vài câu'}, chưa đủ để kết luận là yếu, chỉ cần xem lại.<br>` : '';
  t += weak.length ? `<b style="color:var(--bad)">Cần bổ trợ:</b> ${weak.map(x => esc(x.name) + ' (' + x.ok + '/' + x.n + ')').join(', ')}. Sai nhiều ở các chủ đề này, nên ôn lần lượt từng chủ đề, bắt đầu từ <b>${esc(weak[0].name)}</b> (thấp nhất), rồi làm bài bổ trợ bên dưới.` : 'Chưa có chủ đề nào cần bổ trợ gấp. Nên giữ phong độ và thử bài khó hơn.';
  if (d.topics.length && Math.max(...d.topics.map(x => x.n)) <= 4) t += '<br><span class="mut">Mỗi chủ đề chỉ có vài câu nên đây là đánh giá sơ bộ; sẽ chính xác hơn khi làm thêm các bài khác (xem “Hồ sơ của em”).</span>';
  if (d.review) t += `<br><span class="mut">Có ${d.review} câu chờ giáo viên chấm, chưa tính vào điểm.</span>`;
  return t;
}
function reportBody(d) {
  const weak = d.topics.filter(x => x.level === 'weak'), watch = d.topics.filter(x => x.level === 'watch');
  const cnt = { g: 0, a: 0, r: 0, n: 0 };
  const slices = d.topics.map(t => ({ label: t.name, value: t.n, color: lvColor(t, cnt[lvCls(t)]++), right: lvTxt[lvCls(t)] + ' · ' + t.ok + '/' + t.n }));
  const mins = Math.max(1, Math.round(d.sec / 60));
  const fc = d.focus || [], sp = d.specials || [];
  return `<div class="kpis"><div class="kpi"><b style="color:${d.score >= 70 ? 'var(--ok)' : 'var(--bad)'}">${d.score}%</b><span>Điểm</span></div><div class="kpi"><b>${d.correct}/${d.total}</b><span>Câu đúng</span></div><div class="kpi"><b>${d.rank}/${d.classN}</b><span>Xếp hạng trong ${d.classN} bạn đã làm${d.classSize ? ' (sĩ số ' + d.classSize + ')' : ''}</span></div><div class="kpi"><b>${d.classAvg}%</b><span>Điểm TB lớp</span></div><div class="kpi"><b>${mins}'</b><span>Thời gian làm</span></div></div>
  <div class="panel"><h3 style="margin:0 0 8px">Nhận xét tổng thể</h3><div class="sumbox">${reportSummary(d)}</div></div>
  ${fc.length || sp.length ? `<div class="panel"><h3 style="margin:0 0 8px">Đề này dò gì</h3><div class="focusbox">${fc.map(f => { const c = f.n ? lvCls(f) : 'n'; return `<div class="row2"><span><b>${esc(f.name)}</b>${f.n ? ` <span class="mut">(${f.ok}/${f.n} câu)</span>` : ' <span class="mut">(chưa có câu nào gắn nhãn này)</span>'}</span><span class="lvtag ${c}">${lvTxt[c]}</span></div>`; }).join('')}${sp.length ? `<div class="hd">Cấu trúc đặc biệt cần lưu ý</div><ul class="gp">${sp.map(s => `<li>${fmt(s)}</li>`).join('')}</ul>` : ''}</div></div>` : ''}
  <div class="two-col"><div class="panel"><h3 style="margin:0">Mạnh / yếu theo chủ đề</h3><div class="mut">Mỗi miếng là một chủ đề, độ lớn theo số câu. Xanh: vững. Vàng: cần củng cố (sai ít). Đỏ: cần bổ trợ (sai từ 2 câu và đúng dưới 60%).</div>${pieChart(slices, d.score + '%', 'ĐIỂM')}</div>
  <div class="panel"><h3 style="margin:0">Kết quả các câu</h3><div class="mut">Đúng, sai và bỏ trống</div>${pieChart([{ label: 'Đúng', value: d.correct, color: '#16a34a' }, { label: 'Sai', value: d.wrong, color: '#dc2626' }, { label: 'Bỏ trống', value: d.blank, color: '#9ca3af' }], d.correct + '/' + d.total, 'CÂU ĐÚNG')}</div></div>
  ${d.parts && d.parts.length ? `<div class="panel"><h3 style="margin:0">Theo phần (cao → thấp)</h3><div class="bars">${barRows(d.parts)}</div></div>` : ''}
  <div class="panel"><h3 style="margin:0">Theo chủ đề (cao → thấp)</h3><div class="bars">${barRows(d.topics)}</div><div class="mut" style="font-size:12px">Xanh: vững · Vàng: cần củng cố · Đỏ: cần bổ trợ</div></div>
  <div class="panel"><h3 style="margin:0">Cần bổ trợ điểm nào</h3>${weak.length ? `<ul class="gp">${weak.map(x => `<li><b>${esc(x.name)}</b>: đúng ${x.ok}/${x.n} câu (${x.pct}%)</li>`).join('')}</ul>` : '<p>Chưa có chủ đề nào cần bổ trợ gấp.</p>'}
   ${watch.length ? `<div class="hd">Nên xem lại thêm</div><ul class="gp">${watch.map(x => `<li>${esc(x.name)}: đúng ${x.ok}/${x.n} câu</li>`).join('')}</ul>` : ''}
   ${(d.remedials || []).map(x => `<div class="remcard"><div class="mut" style="font-size:12px">Bài bổ trợ cho: ${esc(x.topic)}</div><b>${esc(x.title)}</b>${x.objectives ? `<div>Làm xong em sẽ: ${esc(x.objectives)}</div>` : ''}<div style="margin-top:8px" class="noprint"><a class="btn sm" href="#/ex/${esc(x.id)}">Mở bài bổ trợ</a></div></div>`).join('')}
   ${weak.length && !(d.remedials || []).length ? '<p class="mut">Chưa có bài bổ trợ gắn với các chủ đề này. Giáo viên có thể tạo bài và đặt “Bổ trợ cho chủ đề” trùng tên chủ đề.</p>' : ''}</div>
  ${d.history && d.history.length > 1 ? `<div class="panel"><h3 style="margin:0">Tiến bộ qua các bài</h3>${lineChart(d.history.map(x => ({ l: x.d, v: x.score, t: x.title })), 'Điểm qua các bài')}</div>` : ''}`;
}
async function viewReport(tok) {
  app.innerHTML = '<div class="empty">Đang tải báo cáo…</div>';
  const k = tok.lastIndexOf('.'), id = decodeURIComponent(tok.slice(0, k)), sig = tok.slice(k + 1);
  if (DEMO || k < 1) { app.innerHTML = '<div class="notice bad">Link báo cáo không hợp lệ.</div>'; return; }
  let d; try { d = await api({ action: 'studentReport', id, sig }); } catch (e) { app.innerHTML = '<div class="notice bad">Không kết nối được máy chủ.</div>'; return; }
  if (!d.ok) { app.innerHTML = `<div class="notice bad">${esc(d.error || 'Không mở được báo cáo.')}</div>`; return; }
  app.innerHTML = `<div class="hero" style="margin-top:10px"><div class="eyebrow">Báo cáo cá nhân</div><h1>${esc(d.name)} · Lớp ${esc(d.cls)}</h1><p>${esc(d.title)} · nộp lúc ${esc(d.time)}</p></div>` + reportBody(d) +
    `<div class="row end noprint" style="margin-top:14px"><button class="btn ghost" data-act="printrep">In / lưu PDF</button></div>`;
}
document.addEventListener('click', e => { const b = e.target.closest('button'); if (b && b.dataset.act === 'printrep') window.print(); });

route();
</script>
</body>
</html>
